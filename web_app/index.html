
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Blog Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f6, #ffd6e8);
      margin: 0;
      padding: 50px 20px;
      min-height: 100vh;
      color: #4a2340;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 22px;
      box-shadow: 0 8px 30px #f5c4dc;
    }

    h1 {
      color: #e75498;
      text-align: center;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #865773;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      font-size: 16px;
      outline-color: #e75498;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      background: #e75498;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #c9367c;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #fff5fa;
      border-radius: 12px;
      border: 1px solid #f8bbd0;
      white-space: pre-wrap;
      line-height: 1.7;
      overflow-wrap: anywhere;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 13px;
      color: #865773;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>💗 AI Blog Generator</h1>

    <p class="subtitle">
      Transform your ideas into blog posts with AI ✨
    </p>

    <label for="topic">What would you like to write about?</label>

    <input
      type="text"
      id="topic"
      placeholder="Example: Cybersecurity for College Students"
    >

    <button id="generate" onclick="generateBlog()">
      ✨ Generate My Blog
    </button>

    <div id="result" aria-live="polite"></div>

    <p class="footer">
      Powered by Google Gemini AI and Python FastAPI
    </p>

  </main>

  <script>
    async function generateBlog() {
      const topic = document.getElementById("topic").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("generate");

      result.style.display = "block";

      if (!topic) {
        result.textContent = "💗 Please enter a blog topic!";
        return;
      }

      button.disabled = true;
      button.textContent = "Generating... ✨";

      result.textContent =
        "✨ Your AI agents are creating your blog post. Please wait...";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ topic: topic })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Generation failed.");
        }

        result.textContent = data.blog;

      } catch (error) {
        result.textContent =
          "Something went wrong: " + error.message;

      } finally {
        button.disabled = false;
        button.textContent = "✨ Generate My Blog";
      }
    }
  </script>
</body>
</html>
